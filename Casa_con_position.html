<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa con position</title>
    <style> 
      body {
        background-color: lightblue;
        margin: 0;
      }

      .casa {
        margin-top: 150px;
        margin-left: 200px;
      }

      .tejado{
         width:0px;
         height:0px;
         border-left: 200px solid transparent;
         border-right:200px solid transparent;
         border-bottom:100px solid darkred;
      }

      .fachada{
         position: relative;
         width: 400px;
         height: 350px;
         background-color: darkgray;
      }

      .ventana{
         position: absolute;
         width: 60px;
         height: 75px;
         background-color: skyblue;
      }

      .v1{
        top: 80px;
        left: 60px;
      }

      .v2{
        top: 80px;
        right: 60px;
      }

      .puerta{
         position: absolute;
         bottom:0px;
         left:175px;
         width: 50px;
         height: 100px;
         background-color: sienna ;
      }

      .chimenea {
        position: absolute;
        background-color: darkslategray;
        width: 40px;
        height: 80px;
        top: -70px;
        left: 20px;
        z-index: -1;
      }

      .cesped{
         background-color: darkgreen;
         width: 100%;
         height: 500px;
      }

    </style>
</head>
<body>

    <div class="casa">
      <div class="tejado"></div>
      <div class="fachada">
        <div class="ventana v1"></div>
        <div class="ventana v2"></div>
        <div class="puerta"></div>
        <div class="chimenea"></div>
     </div>
    </div>
    <div class="cesped"></div>

    </body>
</html>

<!--

z-index controla la profundidad de los elementos, determinando que caja se superpone a otra cuando ocupan el mismo espacio.
No se mide en px, solo en numeros enteros, numeros positivos traen el elemento hacia delante, numeros negativos empujan el elemento hacia el fondo.

-->
