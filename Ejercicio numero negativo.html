<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script> 
    let tab_numeros= [1,2,3,-4,-5];
    //........//FUNCIONES//.............
    function Visualizar (tab_numeros) {
        for (valor of tab_numeros){
            if (valor<0){
                document.write(valor);
            }
        }
    }

    //.............PROGRAMA PRINCIPAL...............
    Visualizar (tab_numeros);
    </script> 
</body>
</html>
